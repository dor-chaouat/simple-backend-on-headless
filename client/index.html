<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 30% 20%, #1e1b4b, #0f172a 70%);
        color: #e2e8f0;
      }
      [hidden] { display: none !important; }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 2.5rem 2rem;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        text-align: center;
      }
      h1 { margin: 0; font-size: 1.6rem; }
      .muted { margin: 0; color: #94a3b8; }
      .btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font: inherit;
        font-weight: 600;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
      .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
      .google { background: #fff; color: #1f2937; }
      .facebook { background: #1877f2; color: #fff; }
      .logout {
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        color: #fff;
        margin-top: 0.5rem;
      }
      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        display: grid;
        place-items: center;
        font-size: 2.25rem;
        font-weight: 700;
        color: #fff;
      }
      dl {
        width: 100%;
        margin: 0.5rem 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.5rem 1rem;
        text-align: left;
        font-size: 0.95rem;
      }
      dt { color: #94a3b8; }
      dd { margin: 0; word-break: break-all; }
      .error { color: #fca5a5; margin: 0; }
    </style>
  </head>
  <body>
    <main class="card" id="loading">
      <p class="muted">Loading…</p>
    </main>

    <main class="card" id="login" hidden>
      <h1>Welcome</h1>
      <p class="muted">Sign in to continue</p>
      <button class="btn google" data-idp="google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.3 14.6 2.3 12 2.3 6.7 2.3 2.4 6.6 2.4 12s4.3 9.7 9.6 9.7c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/>
        </svg>
        Continue with Google
      </button>
      <button class="btn facebook" data-idp="facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v2.9h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/>
        </svg>
        Continue with Facebook
      </button>
      <p class="error" id="login-error" hidden></p>
    </main>

    <main class="card" id="profile" hidden>
      <div class="avatar" id="avatar"></div>
      <h1 id="name"></h1>
      <p class="muted" id="email"></p>
      <dl id="details"></dl>
      <button class="btn logout" id="logout">Log out</button>
    </main>

    <script type="module">
      import { createClient, OAuthStrategy } from "https://esm.sh/@wix/sdk@1";
      import { members } from "https://esm.sh/@wix/members@1";

      const TOKENS_KEY = "wixTokens";
      const OAUTH_DATA_KEY = "wixOAuthData";
      // Must be listed as an allowed authorization redirect URI in Headless Settings.
      const REDIRECT_URI = `${location.origin}/`;

      const screens = ["loading", "login", "profile"].map((id) => document.getElementById(id));
      const show = (id) => screens.forEach((el) => (el.hidden = el.id !== id));

      function showLoginError(message) {
        const el = document.getElementById("login-error");
        el.textContent = message;
        el.hidden = false;
        show("login");
      }

      const { clientId } = await fetch("/api/config").then((r) => r.json());
      if (!clientId) {
        showLoginError("WIX_CLIENT_ID is not configured on the server.");
        throw new Error("Missing client ID");
      }

      const storedTokens = JSON.parse(localStorage.getItem(TOKENS_KEY) || "null");
      const wixClient = createClient({
        modules: { members },
        auth: OAuthStrategy({ clientId, ...(storedTokens && { tokens: storedTokens }) }),
      });

      // Coming back from Google/Facebook: exchange the code for member tokens.
      async function handleCallback() {
        const oAuthData = JSON.parse(localStorage.getItem(OAUTH_DATA_KEY) || "null");
        if (!oAuthData) return;

        const returned = wixClient.auth.parseFromUrl();
        if (!returned.code && !returned.error) return;

        localStorage.removeItem(OAUTH_DATA_KEY);
        history.replaceState(null, "", location.pathname);

        if (returned.error) throw new Error(returned.errorDescription || returned.error);

        const tokens = await wixClient.auth.getMemberTokens(returned.code, returned.state, oAuthData);
        wixClient.auth.setTokens(tokens);
        localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
      }

      async function login(idp) {
        const oAuthData = wixClient.auth.generateOAuthData(REDIRECT_URI, location.href);
        localStorage.setItem(OAUTH_DATA_KEY, JSON.stringify(oAuthData));
        const { authUrl } = await wixClient.auth.getAuthUrl(oAuthData, { idp });
        location.href = authUrl;
      }

      async function logout() {
        const { logoutUrl } = await wixClient.auth.logout(REDIRECT_URI);
        localStorage.removeItem(TOKENS_KEY);
        location.href = logoutUrl;
      }

      async function renderProfile() {
        const { member } = await wixClient.members.getCurrentMember({ fieldsets: ["FULL"] });
        const contact = member.contact ?? {};
        const fullName = [contact.firstName, contact.lastName].filter(Boolean).join(" ");
        const name = member.profile?.nickname || fullName || member.loginEmail;

        const avatar = document.getElementById("avatar");
        const photo = member.profile?.photo?.url;
        avatar.replaceChildren();
        if (photo) {
          const img = document.createElement("img");
          img.src = photo;
          img.alt = "";
          img.className = "avatar";
          avatar.replaceWith(img);
        } else {
          avatar.textContent = (name || "?").charAt(0).toUpperCase();
        }

        document.getElementById("name").textContent = name;
        document.getElementById("email").textContent = member.loginEmail ?? "";

        const created = member._createdDate ?? member.createdDate;
        const rows = [
          ["Name", fullName],
          ["Status", member.status],
          ["Member since", created && new Date(created).toLocaleDateString()],
        ].filter(([, value]) => value);

        document.getElementById("details").replaceChildren(
          ...rows.flatMap(([label, value]) => {
            const dt = document.createElement("dt");
            const dd = document.createElement("dd");
            dt.textContent = label;
            dd.textContent = value;
            return [dt, dd];
          }),
        );

        show("profile");
      }

      document.querySelectorAll("[data-idp]").forEach((button) =>
        button.addEventListener("click", async () => {
          document.querySelectorAll("[data-idp]").forEach((b) => (b.disabled = true));
          try {
            await login(button.dataset.idp);
          } catch (err) {
            document.querySelectorAll("[data-idp]").forEach((b) => (b.disabled = false));
            showLoginError(err.message);
          }
        }),
      );
      document.getElementById("logout").addEventListener("click", logout);

      try {
        await handleCallback();
        if (wixClient.auth.loggedIn()) {
          await renderProfile();
        } else {
          show("login");
        }
      } catch (err) {
        localStorage.removeItem(TOKENS_KEY);
        showLoginError(err.message);
      }
    </script>
  </body>
</html>
